<!doctype html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/speech-to-text/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dictation App - AI Audio Note Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="/speech-to-text/assets/index-jqdIF0Io.js"></script>
  <link rel="stylesheet" crossorigin href="/speech-to-text/assets/index-Bm9bwXX8.css">
</head>

<body>
  <div class="app-container">
    <div class="main-content">
      <div class="note-area">
        <div class="note-header">
          <div class="editor-title" contenteditable="true" role="textbox" aria-multiline="false" aria-label="Not Başlığı" placeholder="Başlıksız Not">
            Başlıksız Not
          </div>
          <div class="note-header-actions">
            <div class="tab-navigation-container">
              <div class="tab-navigation" role="tablist">
                <button class="tab-button active" data-tab="note" role="tab" aria-selected="true">Düzenlenmiş</button>
                <button class="tab-button" data-tab="raw" role="tab" aria-selected="false">Ham</button>
                <div class="active-tab-indicator"></div>
              </div>
            </div>
            <a
              href="https://www.yucelgumus.dev/"
              target="_blank"
              rel="noopener noreferrer"
              class="author-badge"
              title="Geliştirici: Yücel Gümüş"
              aria-label="Geliştirici Portfolyosu: Yücel Gümüş"
            >
              <span class="author-dot"></span>
              <span class="author-text">Yücel Gümüş</span>
              <i class="fas fa-arrow-up-right-from-square"></i>
            </a>
          </div>
        </div>

        <div class="note-content-wrapper">
          <div id="polishedNote" class="note-content active" contenteditable="true" role="textbox" aria-multiline="true"
            aria-label="Düzenlenmiş Not" placeholder="Düzenlenmiş notlarınız burada görünecek..."></div>
          <div id="rawTranscription" class="note-content" contenteditable="true" role="textbox" aria-multiline="true"
            aria-label="Ham Transkripsiyon" placeholder="Ham transkripsiyon burada görünecek..."></div>
        </div>
      </div>

      <div class="recording-interface">
        <div id="liveRecordingTitle" class="live-recording-title" style="display: none">
          Kayıt Alınıyor
        </div>
        <canvas id="liveWaveformCanvas" style="display: none"></canvas>
        <div id="liveRecordingTimerDisplay" class="live-recording-timer" style="display: none">
          00:00.00
        </div>

        <div class="language-selector">
          <select id="languageSelect" title="Dil Seçin" aria-label="Kayıt Dili Seçin">
            <option value="tr" selected>🇹🇷 Türkçe</option>
            <option value="en">🇬🇧 English</option>
            <option value="de">🇩🇪 Deutsch</option>
            <option value="fr">🇫🇷 Français</option>
            <option value="es">🇪🇸 Español</option>
            <option value="it">🇮🇹 Italiano</option>
            <option value="pt">🇵🇹 Português</option>
            <option value="ru">🇷🇺 Русский</option>
            <option value="ja">🇯🇵 日本語</option>
            <option value="zh">🇨🇳 中文</option>
            <option value="ar">🇸🇦 العربية</option>
          </select>
        </div>

        <div class="status-indicator">
          <span id="recordingStatus" class="status-text">Kayıt almaya hazır</span>
        </div>

        <div class="recording-controls">
          <button class="action-button" id="themeToggleButton" title="Temayı Değiştir" aria-label="Temayı Değiştir">
            <i class="fas fa-sun"></i>
          </button>

          <button id="recordButton" class="record-button" title="Kaydı Başlat/Durdur" aria-label="Kaydı Başlat veya Durdur">
            <div class="record-button-inner">
              <i class="fas fa-microphone"></i>
            </div>
            <svg class="record-waves" viewBox="0 0 200 200">
              <circle class="wave wave1" cx="100" cy="100" r="40" />
              <circle class="wave wave2" cx="100" cy="100" r="70" />
              <circle class="wave wave3" cx="100" cy="100" r="100" />
            </svg>
            <span class="record-text">Kaydet</span>
          </button>

          <button class="action-button with-label" id="newButton" title="Yeni Not Oluştur" aria-label="Yeni Not Oluştur">
            <i class="fas fa-plus"></i>
            <span class="action-label">Yeni</span>
          </button>

          <button class="action-button with-label" id="downloadNoteButton" title="Notu İndir" aria-label="Notu İndir">
            <i class="fas fa-download"></i>
            <span class="action-label">İndir</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="micStatus" class="debug-panel"></div>

</body>

</html>
